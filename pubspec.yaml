name: aes_team_app
description: Aishwarya Engineering Services team app - attendance, leave, advances, vehicle log, payroll, jobs, billing.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  http: ^1.2.2
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
