# Builds the Android APK on GitHub's servers on every push.
# Each successful build on main is published as the "latest" release:
# https://github.com/ragulrajamannarsamy-cmyk/AES_TEAM_APP/releases/latest
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: 3.38 is the last line on Android Gradle Plugin 8.
          # Newer Flutter (AGP 9, built-in Kotlin) breaks file_picker,
          # which still applies the Kotlin Gradle Plugin.
          channel: stable
          flutter-version: 3.38.10
          cache: true

      - name: Generate Android project
        run: bash tool/prepare_android.sh

      - name: Get packages
        run: flutter pub get

      # Real Firebase keys: add repository secret GOOGLE_SERVICES_JSON
      # (contents of google-services.json) and FIREBASE_OPTIONS_DART
      # (contents of lib/firebase_options.dart from `flutterfire configure`).
      - name: Firebase config (if provided)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FOD: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; fi
          if [ -n "$FOD" ]; then printf '%s' "$FOD" > lib/firebase_options.dart; fi

      # Permanent signing key: repository secrets KEYSTORE_BASE64 and
      # KEYSTORE_PASSWORD. Without them the APK is debug-signed.
      - name: Signing key (if provided)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > android/app/aes-release.jks
            printf 'storeFile=aes-release.jks\nstorePassword=%s\nkeyAlias=aes\nkeyPassword=%s\n' "$PW" "$PW" > android/key.properties
            echo "Signing with company key."
          else
            echo "::warning::No signing key secrets; APK is debug-signed."
          fi

      - name: Analyze (report only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings | tee analyze.txt || true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aes-team-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            analyze.txt
          if-no-files-found: warn

      - name: Publish APK as "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AES-Team.apk
          NOTES="Build ${{ github.run_number }} · commit ${GITHUB_SHA::7} · $(date -u '+%d %b %Y %H:%M') UTC"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest AES-Team.apk --title "AES Team App (latest)" --notes "$NOTES" --latest
